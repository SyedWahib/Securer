[package]
name = "securer"
version = "0.1.0"
edition = "2021"
description = "Blocks coding-agent shell commands and file tools that reach outside the project directory, and tells the agent why."
license = "Apache-2.0"
repository = "https://github.com/SyedWahib/Securer"
readme = "README.md"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
